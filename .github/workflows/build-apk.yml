name: Build Android APK

on:
  push:
    branches:
      - arena/01a047c5-arenascan
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android scaffold
        run: flutter create . --platforms=android --org com.proscan --project-name proscan_ai

      - name: Get packages
        run: flutter pub get


      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proscan-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release asset
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: Latest APK
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          commit: ${{ github.sha }}
          body: |
            Latest working Android APK for ProScan AI.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
